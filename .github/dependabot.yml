version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(deps)'
    # Every minor and patch update arrives in one weekly PR, so a week's updates are one merge and
    # one CI run. Each major update still gets its own PR, so one breaking release can't hold up the
    # rest, and closing it skips just that version. Satori is left out so its updates keep arriving
    # as their own PRs: they're the reminder that its upgrade is outstanding (see docs/decisions.md).
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
        patterns: ['*']
        exclude-patterns: ['satori']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Australia/Melbourne
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
