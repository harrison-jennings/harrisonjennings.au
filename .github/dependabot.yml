version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(deps)'
    # Minor and patch updates are grouped; each major update gets its own PR, so one breaking
    # release can't hold up the rest of its group, and closing it skips just that version.
    groups:
      astro:
        update-types: ['minor', 'patch']
        patterns: ['astro', '@astrojs/*']
      tooling:
        update-types: ['minor', 'patch']
        patterns:
          [
            'eslint',
            'eslint-*',
            '@eslint/*',
            'typescript',
            'typescript-eslint',
            'prettier',
            'prettier-*',
            'globals',
          ]
      cloudflare:
        update-types: ['minor', 'patch']
        patterns: ['wrangler', '@cloudflare/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Australia/Melbourne
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
