name: Dependency review

# Blocks pull requests that add dependencies with known vulnerabilities or unsuitable licences.
# Like CodeQL, it needs a public repository (or GitHub Advanced Security), so it skips while private.
on:
  # Called by the CI Orchestrator, on pull requests only.
  workflow_call:

permissions:
  contents: read
  # To comment the summary on a pull request when the review fails.
  pull-requests: write

jobs:
  review:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: on-failure
