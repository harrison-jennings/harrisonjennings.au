# Posts a Worker's Cloudflare preview link on the branch's pull request.
#
# Workers Builds only comments on a pull request when the PR already exists as the build starts, so a PR
# opened with or after its branch's push often misses Cloudflare's comment, for either Worker. This fills
# the gap: one comment per Worker per PR, posted unless that Worker's comment is already there. The link
# is the branch's stable Preview URL.
#
# The CD Orchestrator calls it twice:
#   the site's link when a pull request opens, reopens or gets a push, before the build finishes (the
#   site is built on every push, so its preview always comes);
#   the design system's link when Cloudflare finishes building the design system for a branch (it's
#   only built when a push touches its watch paths, so a link posted earlier could lead nowhere).
name: Preview link

on:
  workflow_call:
    inputs:
      worker:
        description: The Worker whose preview to link (harrisonjennings-au, harrisonjennings-au-design)
        required: true
        type: string
      label:
        description: What the comment calls the preview (Preview, Design system preview)
        required: true
        type: string
      branch:
        description: The pull request's branch
        required: true
        type: string
      pr:
        description: The pull request's number; looked up from the branch when it's left empty
        required: false
        type: string
        default: ''
      note:
        description: The line under the link
        required: true
        type: string

permissions:
  # To check out the repository (for scripts/preview-url.sh), and to comment.
  contents: read
  pull-requests: write

concurrency:
  group: preview-link-${{ inputs.worker }}-${{ inputs.branch }}

jobs:
  comment:
    name: Post the preview link
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Post the link unless it's already there
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Passed as data, never pasted into the script: branch names can contain anything.
          WORKER: ${{ inputs.worker }}
          LABEL: ${{ inputs.label }}
          BRANCH: ${{ inputs.branch }}
          PR: ${{ inputs.pr }}
          NOTE: ${{ inputs.note }}
        run: |
          if [ -z "$PR" ]; then
            PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
            if [ -z "$PR" ]; then
              echo "No open pull request for this branch."
              exit 0
            fi
          fi
          # The site's marker predates the design system's comment, so open PRs keep theirs.
          if [ "$WORKER" = harrisonjennings-au ]; then
            marker='<!-- preview-link -->'
          else
            marker="<!-- preview-link:$WORKER -->"
          fi
          if gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[].body' | grep -qF "$marker"; then
            echo "$LABEL link already posted."
            exit 0
          fi
          url=$(WORKER="$WORKER" bash scripts/preview-url.sh "$BRANCH")
          if [ -z "$url" ]; then
            # Long names get a shortened name and a hash from Cloudflare, so there's no link to build.
            line="**$LABEL:** this branch name is too long to predict the address: find it under the $WORKER Worker's **Previews** in the Cloudflare dashboard."
          else
            line="**$LABEL:** $url"
          fi
          body="$marker
          $line

          $NOTE"
          gh pr comment "$PR" --repo "$REPO" --body "$body"
