name: CodeQL

# Code scanning is free on public repositories. While the repository is private these jobs skip,
# so nothing fails; they start working as soon as it is made public.
on:
  # Called by the CI Orchestrator on each pull request and on main, and run weekly on its own.
  workflow_call:
  schedule:
    - cron: '23 18 * * 0' # Mondays 05:23 Melbourne time

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse (${{ matrix.language }})
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
