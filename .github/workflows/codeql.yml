name: CodeQL

# Code scanning is free on public repositories. The jobs check the repository is public, so they'd
# skip rather than fail if it were ever made private.
on:
  # Called by the CI Orchestrator on each pull request and on main, and run weekly on its own.
  workflow_call:
  schedule:
    - cron: '23 18 * * 0' # Mondays 05:23 Melbourne time

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse (${{ matrix.language }})
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
