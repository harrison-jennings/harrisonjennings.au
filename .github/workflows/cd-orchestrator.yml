name: 🚀 CD Orchestrator

# Did the deploy work? Cloudflare Workers Builds deploys every push (main to production, other branches
# to previews); this runs around those deploys and never deploys anything itself.
#   On a pull request: posts the branch's preview link, and records Cloudflare's preview build as a
#   GitHub deployment to the Preview environment once it's live.
#   On main: waits for Cloudflare's production deploy of that commit and smoke-tests that exact version
#   through its preview address (Bot Fight Mode challenges GitHub's runners on the real domain). From
#   cutover (the PRODUCTION_LIVE repository variable is `true`) it also checks the live domain and
#   records a deployment to Production.
#   The design system (design.harrisonjennings.au, its own Worker) the same way, for the commits
#   Cloudflare builds it for: a Design system preview deployment on a pull request, and on main a smoke
#   test of the deployed version, a live check and a Design system deployment.
# All four environments show in the repository's Deployments panel.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pull requests from forks are skipped: Cloudflare doesn't build them, so there's no preview to link or
  # record, and these jobs hold write permissions that a fork's code shouldn't run alongside.
  preview-link:
    name: preview link
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/preview-link.yml
    permissions:
      contents: read
      pull-requests: write

  preview:
    name: preview
    # Dependabot's pull requests get a read-only token, so they're skipped (as for the link).
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/preview-deployment.yml
    permissions:
      contents: read
      checks: read
      deployments: write

  design-system-preview:
    name: design system preview
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/design-system-preview.yml
    permissions:
      contents: read
      checks: read
      deployments: write

  deployed-version:
    name: deployed version
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/production-version.yml
    permissions:
      contents: read
      checks: read
    secrets:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

  production:
    name: production
    needs: deployed-version
    if: github.event_name != 'pull_request' && vars.PRODUCTION_LIVE == 'true'
    uses: ./.github/workflows/production-live.yml
    permissions:
      contents: read
      deployments: write

  design-system:
    name: design system
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/design-system-production.yml
    permissions:
      contents: read
      checks: read
      deployments: write
    secrets:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
