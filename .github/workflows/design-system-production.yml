name: Design system

# Called by the CD Orchestrator after each push to main: when Cloudflare built the design system for the
# commit (only pushes that touch its watch paths do), waits for its deploy, smoke-tests that exact
# version through its preview address (scripts/design-smoke-test.sh, with the Access service token),
# checks the live domain as far as Bot Fight Mode allows, and records a deployment to the Design system
# environment, so the repository's Deployments panel shows it. Rolling back is Cloudflare's job (deploy
# the previous version from the Worker's Deployments tab).
on:
  workflow_call:
    secrets:
      CF_ACCESS_CLIENT_ID:
        required: true
      CF_ACCESS_CLIENT_SECRET:
        required: true

permissions:
  contents: read
  checks: read
  deployments: write

jobs:
  # Decided before the recording job starts: a job with an environment records a deployment as soon
  # as it runs, built or not.
  built:
    name: Did Cloudflare build the design system?
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      built: ${{ steps.built.outputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look for its build of this commit
        id: built
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKER: harrisonjennings-au-design
        run: echo "built=$(bash scripts/cloudflare-built.sh "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

  live:
    name: Check the design system
    needs: built
    if: needs.built.outputs.built == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Design system
      url: https://design.harrisonjennings.au/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for Cloudflare's deploy of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKER: harrisonjennings-au-design
        run: bash scripts/wait-for-cloudflare.sh "$GITHUB_SHA"

      - name: Find the version's preview address
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKER: harrisonjennings-au-design
        run: |
          url=$(bash scripts/version-url.sh "$GITHUB_SHA")
          echo "Testing $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke-test it
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          URL: ${{ steps.version.outputs.url }}
        run: bash scripts/design-smoke-test.sh "$URL"

      - name: Check the live domain
        run: bash scripts/design-live-check.sh
