name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Drafts stay out of the production build
        run: test ! -e dist/blog/formatting-reference

      - name: Keep the build for review
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # Rebuilds with drafts included (the formatting reference), then tests dist/ served by wrangler
      # dev (see playwright.config.ts). The production build above is what's kept for review.
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Keep the Playwright report if tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
