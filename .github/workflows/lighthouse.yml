name: Lighthouse

# Called by the CI Orchestrator: Lighthouse on the home page, the blog, a post and projects (three runs
# each, median), failing below 95 on performance, accessibility, best practices and SEO. See
# lighthouserc.json. @lhci/cli runs with npx at the version pinned in package.json's `lighthouse`
# script rather than as a dependency: its own dependencies carry advisories Dependabot would raise.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build and run Lighthouse
        run: npm run lighthouse

      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 7
