name: Design system preview

# Called by the CD Orchestrator when Cloudflare finishes building the design system for a branch (only
# pushes that touch its watch paths are built): records the build as a GitHub deployment to the Design
# system preview environment with the branch's Preview URL, so it shows in the pull request and the
# repository's Deployments panel (marked failed if Cloudflare's build failed). Cloudflare does the
# deploying; this only records it.
on:
  workflow_call:
    inputs:
      sha:
        description: The commit Cloudflare built
        required: true
        type: string
      branch:
        required: true
        type: string
      conclusion:
        description: How Cloudflare's build ended (success, failure…)
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: design-system-preview-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  record:
    name: Record the design system preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record the deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Passed as data, never pasted into the script: branch names can contain anything.
          BRANCH: ${{ inputs.branch }}
          WORKER: harrisonjennings-au-design
          SHA: ${{ inputs.sha }}
          CONCLUSION: ${{ inputs.conclusion }}
        run: |
          url=$(bash scripts/preview-url.sh "$BRANCH")
          id=$(bash scripts/record-deployment.sh start "Design system preview" "$BRANCH" "$SHA")
          [ -n "$id" ] || exit 0
          if [ "$CONCLUSION" = success ]; then
            bash scripts/record-deployment.sh finish "$id" success "$url"
          else
            bash scripts/record-deployment.sh finish "$id" failure "$url"
            echo "::error::Cloudflare's design system preview build didn't succeed: $CONCLUSION"
            exit 1
          fi
