name: End-to-end

# Called by the CI Orchestrator: the Playwright suite, run beside the quality checks. The site in
# Chromium, the site in WebKit on an iPhone, and the design system each run on their own runner, at the
# same time; "Playwright", the check the merge rule requires, passes only when all three do.
#
# Each runs in Playwright's own container image, which has the browsers and their system libraries
# installed, so nothing is downloaded from Ubuntu's mirrors on each run (a slow mirror once took seven
# minutes and timed a run out). The image's version is read from the lockfile, so it always matches the
# Playwright the tests use: a mismatched image has no browsers Playwright can find.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  version:
    name: Playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      playwright: ${{ steps.lockfile.outputs.playwright }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false

      - name: Read it from the lockfile
        id: lockfile
        run: |
          version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)
          echo "Playwright $version"
          echo "playwright=$version" >> "$GITHUB_OUTPUT"

  project:
    name: Playwright (${{ matrix.project }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.version.outputs.playwright }}-noble
      # As Playwright's docs run it on GitHub Actions; --init and --ipc=host as its Docker docs advise
      # (no zombie processes; enough shared memory for Chromium).
      options: --user 1001 --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit-iphone, design-system]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Builds with drafts included (the formatting reference) and the design system, applies the D1
      # migrations locally, then tests both served by wrangler dev (see playwright.config.ts).
      - name: End-to-end tests
        run: npm run test:e2e -- --project "$PROJECT"
        env:
          PROJECT: ${{ matrix.project }}
          WRANGLER_SEND_METRICS: 'false'

      - name: Keep the Playwright report if tests fail
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  playwright:
    name: Playwright
    needs: project
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All three passed
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.project.result }}
