name: End-to-end

# Called by the CI Orchestrator: the Playwright suite, run beside the quality checks.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright's Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      # Builds with drafts included (the formatting reference), applies the D1 migrations locally, then
      # tests dist/ served by wrangler dev (see playwright.config.ts).
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Keep the Playwright report if tests fail
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
