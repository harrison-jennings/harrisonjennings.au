name: Quality

# Called by the CI Orchestrator: formatting, lint, types, unit tests and the production build.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Drafts stay out of the production build
        run: test ! -e dist/blog/formatting-reference

      - name: Keep the build for review
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
