name: Quality

# Called by the CI Orchestrator: formatting, lint, types, unit tests and the production build.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Drafts stay out of the production build
        run: test ! -e dist/blog/formatting-reference

      - name: Keep the build for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
