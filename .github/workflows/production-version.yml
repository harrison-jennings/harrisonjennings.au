name: Deployed version

# Called by the CD Orchestrator when Cloudflare finishes deploying a Worker from main: runs its smoke
# test (scripts/smoke-test.sh for the site, scripts/design-smoke-test.sh for the design system) against
# that exact version's preview address. The address is on Cloudflare's workers.dev domain, so the zone's
# Bot Fight Mode (which challenges GitHub's runners) doesn't apply; Cloudflare Access does, so the
# preview-checks service token goes with each request.
on:
  workflow_call:
    inputs:
      worker:
        description: The Worker Cloudflare deployed (harrisonjennings-au, harrisonjennings-au-design)
        required: true
        type: string
      smoke-test:
        description: Its smoke test, in scripts/
        required: true
        type: string
      sha:
        description: The commit Cloudflare deployed
        required: true
        type: string
      branch:
        required: true
        type: string
      conclusion:
        description: How Cloudflare's build ended (success, failure…)
        required: true
        type: string
    secrets:
      CF_ACCESS_CLIENT_ID:
        required: true
      CF_ACCESS_CLIENT_SECRET:
        required: true

permissions:
  contents: read
  checks: read

jobs:
  smoke:
    name: Smoke test the deployed version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER: ${{ inputs.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Cloudflare's deploy succeeded
        env:
          CONCLUSION: ${{ inputs.conclusion }}
        run: |
          if [ "$CONCLUSION" != success ]; then
            echo "::error::Cloudflare's build or deploy of $WORKER didn't succeed: $CONCLUSION"
            exit 1
          fi

      # main: the deployed version's own address. A manual run on another branch: that branch's preview
      # (Cloudflare reports a Version ID for production builds only).
      - name: Find the version's preview address
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          # Passed as data, never pasted into the script: branch names can contain anything.
          BRANCH: ${{ inputs.branch }}
        run: |
          url=$(bash scripts/version-url.sh "$SHA" || bash scripts/preview-url.sh "$BRANCH")
          if [ -z "$url" ]; then
            echo "::error::No preview address for $WORKER at $SHA"
            exit 1
          fi
          echo "Testing $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke-test it
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          URL: ${{ steps.version.outputs.url }}
          SMOKE_TEST: ${{ inputs.smoke-test }}
        run: bash "scripts/$SMOKE_TEST" "$URL"
