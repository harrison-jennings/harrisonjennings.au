name: Production smoke test

# Called by the CD Orchestrator after a push to main: waits for Cloudflare's deploy of this commit, then
# runs scripts/smoke-test.sh against the live site. The job is recorded as a GitHub deployment to the
# Production environment (the repository's Deployments panel), marked failed if the smoke test fails.
# A failure emails Harrison; rolling back is Cloudflare's job (deploy the previous version from the
# Worker's Deployments tab).
on:
  workflow_call:

permissions:
  contents: read
  checks: read
  deployments: write

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
      url: https://www.harrisonjennings.au/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Wait for Cloudflare's deploy of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/wait-for-cloudflare.sh "$GITHUB_SHA"

      - name: Smoke-test the live site
        run: bash scripts/smoke-test.sh https://www.harrisonjennings.au
