<!doctype html>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0}
a{color:inherit}
.btn .wipe{clip-path:inset(0 100% 0 0);transition:clip-path 360ms cubic-bezier(.65,0,.35,1)}

.tl{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px;transition:color 150ms ease,text-decoration-thickness 150ms ease}
.tl:hover{text-decoration-thickness:2px}
.nl{position:relative;padding:6px 0;text-decoration:none}
.nl::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1.5px;border-radius:2px;background:var(--accent);transform:scaleX(0);transform-origin:left center;transition:transform 240ms cubic-bezier(.65,0,.35,1)}
.nl:hover::after,.nl:focus-visible::after,.nl[aria-current=page]::after{transform:scaleX(1)}
.nav-menu{display:none}
[data-hero]{min-height:640px;min-height:clamp(640px,100svh,1080px)}
.ib{transition:color 150ms ease}
.tt svg{position:absolute;top:12px;left:12px;transition:opacity 200ms ease,transform 320ms cubic-bezier(.65,0,.35,1)}
.tt[data-mode=dark] .sun,.tt[data-mode=light] .moon{opacity:0;transform:rotate(-90deg) scale(.6)}
.tt[data-mode=dark] .moon,.tt[data-mode=light] .sun{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.tt svg{transition:none}}
.ib:hover,.ib:focus-visible{color:var(--link)!important}
:focus-visible{outline:2px solid #C85A52;outline-offset:3px}
@media (max-width:760px){.nav-links,.nav-icons,.nav-cta{display:none!important}.nav-name{font-size:15px}.nav-menu{display:inline-flex!important;margin-left:0!important}.nav-theme{margin-left:auto}[data-hero]{min-height:clamp(560px,100svh,1080px)!important}.hero-inner{padding-top:112px!important;padding-bottom:52px!important;gap:24px!important}.cue-wrap{bottom:18px!important}.hero-title{font-size:44px!important}.hero-sub{font-size:17px!important}.hero-actions{gap:24px!important}.cta-row{width:100%;flex-direction:column-reverse;align-items:stretch!important;gap:18px!important}.cta-row .btn{justify-content:center}.cta-row .tl{align-self:center}}
@media (prefers-reduced-motion:reduce){.btn .wipe,.tl,.nl::after{transition:none}}
</style>
</helmet>
