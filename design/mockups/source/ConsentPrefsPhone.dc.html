<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cookie preferences, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500&amp;family=Schibsted+Grotesk:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; font-family: 'Schibsted Grotesk', system-ui, sans-serif">
<dc-import name="Consent" mode="{{mode}}" view="preferences" device="phone" still="{{still}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "still": {"editor": "boolean", "default": false}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() { return { mode: this.props.mode ?? 'dark', still: !!this.props.still }; }
}
</script>
</body>
</html>
