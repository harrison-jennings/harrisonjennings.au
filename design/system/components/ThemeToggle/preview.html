<!-- @dsCard group="Actions" height=230 subtitle="sun in light, moon in dark; turns a quarter and cross-fades on switch" -->
<div id="pv" class="hj-page pv"><style>.pv{box-sizing:border-box;padding:28px;font-family:var(--font-sans);color:var(--text);background:var(--ground);min-height:100%}.pv *{box-sizing:border-box}.cap{font-size:13px;line-height:1.4;color:var(--muted);margin:0}.h{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:-0.01em;color:var(--text)}.panel{border-radius:var(--radius-lg);background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:18px}.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.duo>[data-theme]{border-radius:var(--radius-lg);background:var(--ground);color:var(--text);padding:24px;display:flex;flex-direction:column;gap:18px;border:1px solid var(--line)}.row{display:flex;align-items:center;flex-wrap:wrap;gap:20px}.cell{display:flex;flex-direction:column;align-items:flex-start;gap:10px}</style>
<div class="duo"><div data-theme="dark"><p class="h">dark: shows the moon</p><div class="row"><button class="hj-icon-btn hj-theme" type="button" data-hj-theme aria-label="Switch to light mode"><svg class="hj-theme__sun" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg><svg class="hj-theme__moon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></button><span class="cap">label: "Switch to light mode"</span></div></div><div data-theme="light"><p class="h">light: shows the sun</p><div class="row"><button class="hj-icon-btn hj-theme" type="button" data-hj-theme aria-label="Switch to light mode"><svg class="hj-theme__sun" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg><svg class="hj-theme__moon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></button><span class="cap">label: "Switch to dark mode"</span></div></div></div><p class="cap" style="margin-top:14px">click either to switch the whole preview; the choice is remembered on the site</p>
</div>
<script>window.HJ && window.HJ.init(document.getElementById("pv"));</script>
