<!-- @dsCard height=300 -->
<div class="cv">
<style>
.cv{position:relative;width:960px;height:300px;overflow:hidden;background:var(--ground);font-family:var(--font-display)}
.cv svg{position:absolute;left:0;top:0}
.cv .brick{fill:var(--accent)}
.cv .apricot{fill:var(--apricot)}
.cv .tint{fill:var(--line)}
.cv .ink{fill:var(--text)}
.cv .ring{fill:none;stroke:var(--ground);stroke-width:3}
.cv .lg{rx:var(--radius-lg)}
.cv .tx{position:absolute;left:44px;bottom:40px;max-width:440px}
.cv .nm{margin:0;font-size:76px;font-weight:500;line-height:.95;letter-spacing:-0.05em;color:var(--text)}
.cv .tg{margin:20px 0 0;font-family:var(--font-sans);font-size:14px;line-height:1.4;color:var(--muted)}
</style>
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
<!--
blocks: accent slab 200x230 (radius-lg), line block 240x150 (radius-lg), apricot pill 200x90 (radius-pill = 45), text disc r22
arrangement: one tall brick slab bleeding off the top with a tint block bleeding top-right and an apricot pill as satellite; all right of x=480
pattern: literal motif (signal) - four ground-coloured rings cut through the blocks from the dot at the slab's corner, the mark's live-signal pulse
scales: rings at 24px steps (space-22 + 2), stroke 3; radii radius-lg 20 and pill
-->
<rect class="tint lg" x="740" y="-20" width="240" height="150"></rect>
<rect class="brick lg" x="520" y="-20" width="200" height="230"></rect>
<rect class="apricot" x="740" y="150" width="200" height="90" rx="45"></rect>
<circle class="ring" cx="720" cy="210" r="36"></circle>
<circle class="ring" cx="720" cy="210" r="60"></circle>
<circle class="ring" cx="720" cy="210" r="84"></circle>
<circle class="ring" cx="720" cy="210" r="108"></circle>
<circle class="ink" cx="720" cy="210" r="12"></circle>
</svg>
<div class="tx"><p class="nm">harrison<br>jennings</p><p class="tg">brick, a single line and a signal: the identity for harrisonjennings.au</p></div>
</div>
<script>/* static cover */</script>
