<!-- @dsCard group="Brand" height=470 subtitle="draw, bounce and signal; all still under reduced motion" -->
<div id="pv" class="hj-page pv"><style>.pv{box-sizing:border-box;padding:28px;font-family:var(--font-sans);color:var(--text);background:var(--ground);min-height:100%}.pv *{box-sizing:border-box}.cap{font-size:13px;line-height:1.4;color:var(--muted);margin:0}.h{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:-0.01em;color:var(--text)}.panel{border-radius:var(--radius-lg);background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:18px}.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.duo>[data-theme]{border-radius:var(--radius-lg);background:var(--ground);color:var(--text);padding:24px;display:flex;flex-direction:column;gap:18px;border:1px solid var(--line)}.row{display:flex;align-items:center;flex-wrap:wrap;gap:20px}.cell{display:flex;flex-direction:column;align-items:flex-start;gap:10px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.tile{border-radius:var(--radius-lg);background:var(--surface);height:220px;display:flex;align-items:center;justify-content:center}</style>
<div class="tiles"><div class="cell" style="align-items:stretch"><div class="tile"><svg class="hj-mark" width="132" height="132" viewBox="0 0 100 100" aria-hidden="true" id="draw"><path class="hj-mark__h" d="M30 10 V90 M30 58 C30 44 39 38 50 38 C61 38 70 44 70 58 V72" stroke-width="11"></path><circle class="hj-mark__dot" cx="70" cy="88" r="7.5"></circle></svg></div><p class="h">draw</p><p class="cap">the dot runs ahead and draws the h. plays once on load and again on logo hover.</p></div><div class="cell" style="align-items:stretch"><div class="tile"><svg class="hj-mark hj-mark--loading" width="132" height="132" viewBox="0 0 100 100" aria-hidden="true"><path class="hj-mark__h" d="M30 10 V90 M30 58 C30 44 39 38 50 38 C61 38 70 44 70 58 V72" stroke-width="11"></path><circle class="hj-mark__dot" cx="70" cy="88" r="7.5"></circle></svg></div><p class="h">bounce</p><p class="cap">loading only: the booking calendar, the 404 page.</p></div><div class="cell" style="align-items:stretch"><div class="tile"><svg class="hj-mark hj-mark--signal" width="132" height="132" viewBox="0 0 100 100" aria-hidden="true"><path class="hj-mark__h" d="M30 10 V90 M30 58 C30 44 39 38 50 38 C61 38 70 44 70 58 V72" stroke-width="11"></path><circle class="hj-mark__ring" cx="70" cy="88" r="7.5"></circle><circle class="hj-mark__dot" cx="70" cy="88" r="7.5"></circle></svg></div><p class="h">signal</p><p class="cap">the quietest; its small form is the live dot on projects.</p></div></div><div class="panel" style="flex-direction:row;align-items:center;gap:28px;margin-top:20px;padding:16px 22px;flex-wrap:wrap"><span class="cap">at size</span><span class="hj-lockup" data-hj-draw><svg class="hj-mark" width="26" height="26" viewBox="0 0 100 100" aria-hidden="true"><path class="hj-mark__h" d="M30 10 V90 M30 58 C30 44 39 38 50 38 C61 38 70 44 70 58 V72" stroke-width="12"></path><circle class="hj-mark__dot" cx="70" cy="88" r="8.5"></circle></svg>harrison jennings</span><span class="row" style="gap:10px;font-size:15px"><svg class="hj-mark hj-mark--loading" width="28" height="28" viewBox="0 0 100 100" aria-hidden="true"><path class="hj-mark__h" d="M30 10 V90 M30 58 C30 44 39 38 50 38 C61 38 70 44 70 58 V72" stroke-width="12"></path><circle class="hj-mark__dot" cx="70" cy="88" r="8.5"></circle></svg><span style="color:var(--muted)">loading the booking calendar</span></span><span class="hj-live"><span class="hj-live__dot" aria-hidden="true"></span><span style="font-family:var(--font-display);font-size:13px;color:var(--text)">leadlens.harrisonjennings.au</span></span></div>
</div>
<script>var H=window.HJ;if(H){H.init(document.getElementById("pv"));H.draw(document.getElementById("draw"),{loop:true});}</script>
