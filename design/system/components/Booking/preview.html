<div id="pv" class="hj-page pv"><style>.pv{box-sizing:border-box;padding:28px;font-family:var(--font-sans);color:var(--text);background:var(--ground);min-height:100%}.pv *{box-sizing:border-box}.cap{font-size:13px;line-height:1.4;color:var(--muted);margin:0}.h{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:-0.01em;color:var(--text)}.panel{border-radius:var(--radius-lg);background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:18px}.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.duo>[data-theme]{border-radius:var(--radius-lg);background:var(--ground);color:var(--text);padding:24px;display:flex;flex-direction:column;gap:18px;border:1px solid var(--line)}.row{display:flex;align-items:center;flex-wrap:wrap;gap:20px}.cell{display:flex;flex-direction:column;align-items:flex-start;gap:10px}</style>
