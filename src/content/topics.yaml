# The fixed list of topics. Posts reference these ids; a typo fails the build. A topic gets its own page
# at /blog/topic/<id>/ once two published posts use it. Every old /category/<slug>/ URL has a 301 in
# public/_redirects: to its topic, or to /blog/ for the categories that were merged away.
- id: adobe-marketo-engage
